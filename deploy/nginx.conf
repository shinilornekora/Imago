# NGINX перед клиентом (SPEC §8.1, стрелки 1–2 и 3/7b на схеме docs/04).
#   /api/ и /ws      → Document service (DSLR, DSLTS, Hub)
#   /agent/          → Orchestrator (SSE-поток стадий: без буферизации, с долгим таймаутом;
#                      тело команды — не больше 1 МБ)
#   /api/internal/   → 403 снаружи: трассы агента пишет только Orchestrator по внутренней сети (§10.4)
#   остальное        → статика клиента
# TLS здесь нет: локальный запуск и внутренняя сеть; на внешнем входе — свой TLS-терминатор.
#
# Ошибки самого nginx (тело больше лимита, апстрим не отвечает) — тем же JSON, что у
# сервисов: {error: true, code, message, retryable, upstream?}. Упавший апстрим помечен
# заголовком X-Imago-Upstream: down — клиент отличает «сервис лежит» от отказа сервиса.
# Свои ошибки сервисов (например, 503 llm_down у Orchestrator) проходят как есть:
# proxy_intercept_errors выключен, error_page ловит только ответы, которые собрал nginx.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    # Предел тела — тот же, что у Document service (4 МБ, SPEC §9.8). Был 8m: тело 4–8 МБ
    # nginx пропускал, сервис обрывал соединение на пределе, и вместо понятного 413 клиент
    # получал 502 upstream_down — «сервис лежит» (круг 25). Теперь 413 отдаёт сам nginx.
    client_max_body_size 4m;

    # Имена апстримов разрешаются при каждом запросе (DNS Docker), а не при старте: nginx
    # поднимается, даже если orchestrator ещё не готов или упал, и отвечает за него JSON-ом.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;
    set $document_upstream http://document:8080;
    set $orchestrator_upstream http://orchestrator:8090;

    # тело больше client_max_body_size — тоже JSON (в location с error_page повторено:
    # nginx не сливает error_page уровней, а заменяет)
    error_page 413 = @too_large;

    # Клиент — статика; модули ES грузятся по прямым путям, поэтому только index.html fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Служебное: только для Orchestrator внутри сети compose, снаружи закрыто всегда
    location ^~ /api/internal/ {
        default_type application/json;
        return 403 '{"error":true,"code":"forbidden","message":"служебный путь недоступен снаружи","retryable":false}\n';
    }

    location /api/ {
        proxy_pass $document_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # служебный токен приходит только изнутри сети — снаружи его не пропускаем
        proxy_set_header X-Internal-Token "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        # транзакция и тело любого запроса к Document service — не больше 4 МБ, как у него самого
        client_max_body_size 4m;
        error_page 413 = @too_large;   # error_page в location заменяет серверный, не дополняет
        error_page 502 = @document_502;
        error_page 503 = @document_503;
        error_page 504 = @document_504;
    }

    # WebSocket: долгие соединения, апгрейд протокола
    location /ws {
        proxy_pass $document_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        error_page 413 = @too_large;   # error_page в location заменяет серверный, не дополняет
        error_page 502 = @document_502;
        error_page 503 = @document_503;
        error_page 504 = @document_504;
    }

    # Orchestrator: POST /agent/command отвечает потоком SSE (стадии, итог). Буферизация
    # выключена, иначе стадии придут разом в конце; таймаут чтения — под долгие команды
    # (модель думает минутами; сервис шлёт пульс-комментарий, так что тишины дольше нет).
    location /agent/ {
        proxy_pass $orchestrator_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Internal-Token "";
        # команда агента — реплика, выделение и пять пар памяти разговора: мегабайта с
        # запасом хватает (тот же предел у самого Orchestrator, MAX_BODY_BYTES); больше —
        # 413 здесь, не доходя до сервиса
        client_max_body_size 1m;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        gzip off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        # и для прокси впереди этого nginx (корпоративный вход, туннель): поток не копить
        add_header X-Accel-Buffering no always;
        add_header Cache-Control "no-cache" always;
        error_page 413 = @agent_too_large;   # error_page в location заменяет серверный, не дополняет
        error_page 502 = @orchestrator_502;
        error_page 503 = @orchestrator_503;
        error_page 504 = @orchestrator_504;
    }

    location @too_large {
        default_type application/json;
        return 413 '{"error":true,"code":"too_large","message":"запрос больше 4 МБ","retryable":false}\n';
    }

    location @agent_too_large {
        default_type application/json;
        return 413 '{"error":true,"code":"too_large","message":"команда агенту больше 1 МБ","retryable":false}\n';
    }

    location @document_502 {
        default_type application/json;
        add_header X-Imago-Upstream down always;
        add_header Retry-After 5 always;
        return 502 '{"error":true,"code":"upstream_down","message":"сервис документа недоступен","retryable":true,"upstream":"document"}\n';
    }

    location @document_503 {
        default_type application/json;
        add_header X-Imago-Upstream down always;
        add_header Retry-After 5 always;
        return 503 '{"error":true,"code":"upstream_down","message":"сервис документа недоступен","retryable":true,"upstream":"document"}\n';
    }

    location @document_504 {
        default_type application/json;
        add_header X-Imago-Upstream timeout always;
        return 504 '{"error":true,"code":"upstream_timeout","message":"сервис документа не ответил вовремя","retryable":true,"upstream":"document"}\n';
    }

    location @orchestrator_502 {
        default_type application/json;
        add_header X-Imago-Upstream down always;
        add_header Retry-After 5 always;
        return 502 '{"error":true,"code":"upstream_down","message":"сервис агента недоступен","retryable":true,"upstream":"orchestrator"}\n';
    }

    location @orchestrator_503 {
        default_type application/json;
        add_header X-Imago-Upstream down always;
        add_header Retry-After 5 always;
        return 503 '{"error":true,"code":"upstream_down","message":"сервис агента недоступен","retryable":true,"upstream":"orchestrator"}\n';
    }

    location @orchestrator_504 {
        default_type application/json;
        add_header X-Imago-Upstream timeout always;
        return 504 '{"error":true,"code":"upstream_timeout","message":"сервис агента не ответил вовремя","retryable":true,"upstream":"orchestrator"}\n';
    }
}
