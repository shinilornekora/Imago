# NGINX перед клиентом (SPEC §8.1, стрелки 1–2 на схеме docs/04).
# /api и /ws уходят в Document service; всё остальное — статика клиента.
# TLS здесь нет: локальный запуск и внутренняя сеть; на внешнем входе — свой TLS-терминатор.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    client_max_body_size 8m;

    # Клиент — статика; модули ES грузятся по прямым путям, поэтому только index.html fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://document:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # WebSocket: долгие соединения, апгрейд протокола
    location /ws {
        proxy_pass http://document:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
