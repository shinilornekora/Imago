[project]
name = "stand-analysis"
version = "0.1.0"
description = "Анализ и отчёты измерений стенда (SPEC §7.5)"
requires-python = ">=3.11"
dependencies = ["numpy==2.4.4", "pandas==3.0.2", "matplotlib==3.10.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["analysis"]
