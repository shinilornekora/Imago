# Imago Studio — совместная работа и агент на сервере (SPEC §8.1, §10):
# PostgreSQL + Document service + Orchestrator + NGINX.
#   docker compose up --build -d --wait   → http://localhost:8123/
#   docker compose down                   (данные остаются в томе imago-db)
#   docker compose down -v                (стереть базу)
# Переменные — в .env рядом с этим файлом (образец: deploy/env.example).
# Модель агента — LM Studio на машине пользователя: из контейнера она видна как
# host.docker.internal (на Linux его даёт extra_hosts: host-gateway).

x-node-health: &node-health
  interval: 5s
  timeout: 3s
  retries: 20
  start_period: 10s

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: imago
      POSTGRES_PASSWORD: imago
      POSTGRES_DB: imago
    volumes:
      - imago-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imago -d imago"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  document:
    build:
      context: .
      dockerfile: deploy/Dockerfile.document
    environment:
      DATABASE_URL: postgres://imago:imago@db:5432/imago
      PORT: "8080"
      SNAPSHOT_EVERY: ${SNAPSHOT_EVERY:-50}
      # сколько последних снимков хранить (снимок seq 0 остаётся всегда)
      SNAPSHOT_KEEP: ${SNAPSHOT_KEEP:-5}
      # дедлайн обычного запроса к базе, мс: просрочка — 503, клиент повторит (миграции — без него)
      DB_TIMEOUT_MS: ${DB_TIMEOUT_MS:-8000}
      # общий с orchestrator секрет для /api/internal/traces; заглушку change-me сервис
      # не принимает — тогда трассы просто не пишутся (см. deploy/env.example)
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-change-me}
    healthcheck:
      <<: *node-health
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  orchestrator:
    build:
      context: .
      dockerfile: deploy/Dockerfile.orchestrator
    environment:
      PORT: "8090"
      DOCUMENT_URL: http://document:8080
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-change-me}
      LLM_KIND: ${LLM_KIND:-openai}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:1234/v1}
      LLM_MODEL: ${LLM_MODEL:-local-model}
      LLM_API_KEY: ${LLM_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      <<: *node-health
      # /agent/health отвечает 200 и тогда, когда модель недоступна (llm: 'down') —
      # здоровье процесса не зависит от того, запущена ли LM Studio
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/agent/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
    depends_on:
      document:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    ports:
      - "${IMAGO_PORT:-8123}:80"
    healthcheck:
      interval: 5s
      timeout: 3s
      retries: 10
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
    depends_on:
      document:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
    restart: unless-stopped

volumes:
  imago-db:
