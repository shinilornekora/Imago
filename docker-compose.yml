# Imago Studio — совместная работа и агент на сервере (SPEC §8.1, §10):
# PostgreSQL + Document service + Orchestrator + NGINX.
#   docker compose up --build -d --wait   → http://localhost:8123/
#   docker compose down                   (данные остаются в томе imago-db)
#   docker compose down -v                (стереть базу)
# Переменные — в .env рядом с этим файлом (образец: deploy/env.example).
# Модель агента — LM Studio на машине пользователя: из контейнера она видна как
# host.docker.internal (на Linux его даёт extra_hosts: host-gateway).

x-node-health: &node-health
  interval: 5s
  timeout: 3s
  retries: 20
  start_period: 10s

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: imago
      POSTGRES_PASSWORD: imago
      POSTGRES_DB: imago
    volumes:
      - imago-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imago -d imago"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  document:
    build:
      context: .
      dockerfile: deploy/Dockerfile.document
    # Пределы — из .env (круг 29): всё, что Document service читает из окружения
    # (ENV_LIMITS в server/document/index.js, таблица в server/document/README.md), задаётся
    # здесь же; умолчания — те же, что в коде. Описание каждого — deploy/env.example.
    environment:
      DATABASE_URL: postgres://imago:imago@db:5432/imago
      PORT: "8080"
      SNAPSHOT_EVERY: ${SNAPSHOT_EVERY:-50}
      # сколько последних снимков хранить (снимок seq 0 остаётся всегда)
      SNAPSHOT_KEEP: ${SNAPSHOT_KEEP:-5}
      # дедлайн обычного запроса к базе, мс: просрочка — 503, клиент повторит (миграции — без него)
      DB_TIMEOUT_MS: ${DB_TIMEOUT_MS:-8000}
      PRESENCE_TTL_MS: ${PRESENCE_TTL_MS:-45000}
      # сокеты: необработанных транзакций на сокет; сокетов от upgrade до hello
      WS_INFLIGHT: ${WS_INFLIGHT:-2}
      WS_CONNECTING: ${WS_CONNECTING:-6}
      # HTTP-запись: одновременно, в очереди, бюджет тел (байт), срок тела (мс)
      HTTP_WRITE_CONCURRENCY: ${HTTP_WRITE_CONCURRENCY:-8}
      HTTP_WRITE_QUEUE: ${HTTP_WRITE_QUEUE:-64}
      WRITE_BODY_BYTES: ${WRITE_BODY_BYTES:-67108864}
      BODY_TIMEOUT_MS: ${BODY_TIMEOUT_MS:-30000}
      # очереди секвенсора: проекта (байт, транзакций) и всего экземпляра (байт)
      QUEUE_PROJECT_BYTES: ${QUEUE_PROJECT_BYTES:-33554432}
      QUEUE_PROJECT_TXS: ${QUEUE_PROJECT_TXS:-256}
      QUEUE_TOTAL_BYTES: ${QUEUE_TOTAL_BYTES:-134217728}
      # надгробия и память головы секвенсора
      TOMB_KEEP_SEQ: ${TOMB_KEEP_SEQ:-10000}
      TOMB_PRUNE_EVERY: ${TOMB_PRUNE_EVERY:-500}
      TOMB_MAX: ${TOMB_MAX:-50000}
      RECENT_TXS: ${RECENT_TXS:-500}
      RECENT_BYTES: ${RECENT_BYTES:-16777216}
      # круг 33: головы проектов в памяти — байт документов (256 МиБ), сверх — выгрузка давно не тронутых;
      # кеш снимков полного открытия (128 МиБ; 0 — без кеша); импорт документа в потоках: одновременно, в очереди
      HEADS_BYTES: ${HEADS_BYTES:-268435456}
      SNAPSHOT_CACHE_BYTES: ${SNAPSHOT_CACHE_BYTES:-134217728}
      IMPORT_CONCURRENCY: ${IMPORT_CONCURRENCY:-2}
      IMPORT_QUEUE: ${IMPORT_QUEUE:-8}
      IMPORT_TASK_MS: ${IMPORT_TASK_MS:-30000}
      # общий с orchestrator секрет для /api/internal/traces; заглушку change-me сервис
      # не принимает — тогда трассы просто не пишутся (см. deploy/env.example)
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-change-me}
    healthcheck:
      <<: *node-health
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      # Миграции идут при старте и на большой базе длятся минутами (003 считает цепочку
      # всего журнала); всё это время /api/health отвечает 503 migrating. Сбои проверки в
      # start_period не считаются — сервис здоров с первого 200, а не умирает через 100 с.
      # Запас — 10 минут на миграции и ещё 20 проверок по 5 с после них.
      start_period: 600s
      retries: 20
    depends_on:
      db:
        condition: service_healthy
    # SIGTERM: сервис дописывает начатые транзакции и закрывает сокеты (код 1001) — не убивать через 10 с
    stop_grace_period: 15s
    restart: unless-stopped

  orchestrator:
    build:
      context: .
      dockerfile: deploy/Dockerfile.orchestrator
    environment:
      PORT: "8090"
      DOCUMENT_URL: http://document:8080
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-change-me}
      LLM_KIND: ${LLM_KIND:-openai}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:1234/v1}
      LLM_MODEL: ${LLM_MODEL:-local-model}
      LLM_API_KEY: ${LLM_API_KEY:-}
      # пределы Orchestrator (server/orchestrator/README.md) — тоже из .env (круг 29)
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-120000}
      # потолок тела ответа модели, байт; больше — «ответ модели не удалось разобрать» (круг 31)
      LLM_MAX_BODY_BYTES: ${LLM_MAX_BODY_BYTES:-8388608}
      # размер пула воркеров DSLV; пусто — min(2, число ядер)
      WORKERS: ${WORKERS:-}
      WORKER_MAX_MB: ${WORKER_MAX_MB:-512}
      WORKER_TIMEOUT_MS: ${WORKER_TIMEOUT_MS:-60000}
      WORKER_JOBS: ${WORKER_JOBS:-4}
      POOL_QUEUE_MAX: ${POOL_QUEUE_MAX:-32}
      POOL_QUEUE_WAIT_MS: ${POOL_QUEUE_WAIT_MS:-30000}
      QUEUE_MAX: ${QUEUE_MAX:-4}
      DSLR_FULL_CONCURRENCY: ${DSLR_FULL_CONCURRENCY:-4}
      DSLR_FULL_BYTES: ${DSLR_FULL_BYTES:-67108864}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      <<: *node-health
      # /agent/health отвечает 200 и тогда, когда модель недоступна (llm: 'down') —
      # здоровье процесса не зависит от того, запущена ли LM Studio
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/agent/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
    depends_on:
      document:
        condition: service_healthy
    # SIGTERM: новые команды — 503 shutting_down, идущие доводятся до записи
    stop_grace_period: 15s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    ports:
      - "${IMAGO_PORT:-8123}:80"
    healthcheck:
      interval: 5s
      timeout: 3s
      retries: 10
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
    # Редактор поднимается и без агента: правки руками и совместная работа живут на document,
    # а orchestrator может стартовать позже или лежать (модель, ключи) — тогда в шапке
    # «агент недоступен». Поэтому ждём только, что его контейнер запущен, а не здоров;
    # nginx находит его по имени при каждом запросе (resolver), а не при старте.
    depends_on:
      document:
        condition: service_healthy
      orchestrator:
        condition: service_started
    restart: unless-stopped

volumes:
  imago-db:
